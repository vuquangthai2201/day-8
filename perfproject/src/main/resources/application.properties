spring.application.name=perfproject

# H2 in-memory (khong can cai DB)
spring.datasource.url=jdbc:h2:mem:perfdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

# Phat hien van de: bat thong ke Hibernate (dem so query)
spring.jpa.properties.hibernate.generate_statistics=true
# Bat log SQL de thay N+1 (de false khi chay benchmark cho do nhieu log; doi thanh true/DEBUG khi muon quan sat)
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF

# Du lieu mau
app.seed.authors=1000
app.seed.books-per-author=100
