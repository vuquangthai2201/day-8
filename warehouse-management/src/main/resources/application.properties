spring.application.name=warehouse-management

# H2 in-memory (LOCK_TIMEOUT: thoi gian toi da cho cho lock hang, ms)
spring.datasource.url=jdbc:h2:mem:warehouse;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate tu tao bang inventory, inventory_aud, revinfo (Envers)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Du lieu mau (product 1: Laptop Dell XPS, quantity 10)
app.seed.enabled=true
